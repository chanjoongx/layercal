<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <title>Page not found | LayerCal</title>
    <link rel="icon" type="image/svg+xml" href="/calculator-icon.svg" />
    <!--
      Cloudflare Pages serves this file for any request that matches no asset.
      Without it, Pages answered every unknown path with the homepage and a 200,
      which reads as a soft 404 to search engines and to the AI crawlers that
      robots.txt now invites.

      Deliberately standalone: files in public/ are copied verbatim and are not
      scanned by Tailwind, so the styling is inline.
    -->
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(to bottom right, #faf5ff, #ffffff, #eff6ff);
        color: #111827;
      }
      main { text-align: center; max-width: 30rem; }
      .code { font-size: 3.5rem; font-weight: 800; letter-spacing: -0.02em; color: #7c3aed; margin: 0; }
      h1 { font-size: 1.25rem; font-weight: 700; margin: 0.5rem 0 0; }
      p { margin: 0.75rem 0 0; font-size: 0.9375rem; line-height: 1.6; color: #4b5563; }
      .home {
        display: inline-block;
        margin-top: 1.75rem;
        padding: 0.7rem 1.4rem;
        border-radius: 0.6rem;
        background: #7c3aed;
        color: #fff;
        font-size: 0.9375rem;
        font-weight: 600;
        text-decoration: none;
      }
      .home:hover { background: #6d28d9; }
      .home:focus-visible { outline: 2px solid #a78bfa; outline-offset: 3px; }
      @media (prefers-color-scheme: dark) {
        body { background: #111827; color: #f9fafb; }
        p { color: #9ca3af; }
        .code { color: #a78bfa; }
      }
      @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>Page not found</h1>
      <p>
        LayerCal is a single page, so there is nothing at this address.
        The calculator, the formula reference and the FAQ all live on the home page.
      </p>
      <a class="home" href="/">Go to the calculator</a>
    </main>
  </body>
</html>
